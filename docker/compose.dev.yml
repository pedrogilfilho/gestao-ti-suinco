services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gestao
      POSTGRES_PASSWORD: gestao
      POSTGRES_DB: gestao
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:5434:5432"   # 5432 = Postgres do Windows; 5433 = Radar
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
